appId: com.ouricinho.desktop
productName: Ouricinho
copyright: Copyright © 2026 Ouricinho Studio
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
asarUnpack: []
win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: Ouricinho-Portable-${version}.exe
  legalTrademarks: ''
  signAndEditExecutable: false
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: Ouricinho-${version}-${arch}.${ext}
  category: Game
  synopsis: Cozy autonomous virtual hedgehog
  description: Ouricinho is a self-living 3D hedgehog in a cozy procedural diorama.
compression: maximum
npmRebuild: false
